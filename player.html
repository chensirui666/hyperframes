<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>说好只是看流星 · 动画预览</title><style>*{box-sizing:border-box}body{margin:0;background:#181c2a;color:#f1e9d5;font:16px system-ui;padding:28px}main{max-width:1280px;margin:auto}h1{font-size:23px;font-weight:600}#screen{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;box-shadow:0 18px 65px #0008}iframe{width:1920px;height:1080px;transform-origin:0 0;border:0}footer{display:flex;gap:18px;align-items:center;margin:22px 0}button{border:0;border-radius:8px;padding:12px 22px;background:#ead5a2;color:#282431;font-weight:700;cursor:pointer}input{flex:1;accent-color:#ddbe7a}a{color:#d9c59b}p{color:#a9acb8;font-size:14px}</style><main><h1>说好只是看流星</h1><div id="screen"><iframe id="movie" src="index.html"></iframe></div><footer><button id="play" disabled>加载中…</button><input id="seek" type="range" min="0" max="48" step="0.01" value="0"><span id="time">0:00 / 0:48</span></footer><p>48 秒 · 像素人物 × 手绘纸张 · 原创游戏配乐</p><a href="output/说好只是看流星.mp4" download>下载 MP4</a></main><script>
const frame=document.getElementById('movie'),screen=document.getElementById('screen'),play=document.getElementById('play'),seek=document.getElementById('seek');let win,audio,playing=false;new ResizeObserver(()=>frame.style.transform=`scale(${screen.clientWidth/1920})`).observe(screen);
frame.onload=async()=>{win=frame.contentWindow;while(!win.__filmReady)await new Promise(r=>setTimeout(r,50));await win.__filmReady;audio=win.document.getElementById('soundtrack');play.disabled=false;play.textContent='播放';};
play.onclick=async()=>{if(playing){audio.pause();playing=false;}else{if(audio.currentTime>=47.98)audio.currentTime=0;await audio.play();playing=true;}play.textContent=playing?'暂停':'播放';};seek.oninput=()=>{audio.currentTime=Number(seek.value);win.renderFrame(Number(seek.value));};function update(){if(audio){if(playing){win.renderFrame(audio.currentTime);seek.value=audio.currentTime;}if(audio.ended){playing=false;play.textContent='重新播放';}document.getElementById('time').textContent=`0:${String(Math.floor(audio.currentTime)).padStart(2,'0')} / 0:48`;}requestAnimationFrame(update);}update();
</script></html>
